name: Invista Browser Access CI

on:
  pull_request:
    branches: [main]
    paths:
      - "artifacts/api-server/src/routes/invista-browser-access.ts"
      - ".github/workflows/invista-browser-access-ci.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "artifacts/api-server/**"
  push:
    branches: [main]
    paths:
      - "artifacts/api-server/src/routes/invista-browser-access.ts"
      - ".github/workflows/invista-browser-access-ci.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "artifacts/api-server/**"

permissions:
  contents: read

concurrency:
  group: invista-browser-access-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.26.1"
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build
        run: pnpm run build
