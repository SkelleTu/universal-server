name: Deriv Account Architecture Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deriv-account-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Universal Server
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate centralized Deriv gateway
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-artifacts
          python3 - <<'PY'
          from pathlib import Path
          files=[p for p in Path("artifacts/api-server").rglob("*") if p.is_file() and p.suffix in {".ts",".tsx",".js",".mjs",".cjs"}]
          text="\n".join(f.read_text(errors="ignore") for f in files)
          required=["api.derivws.com","/otp","accountId","accountType","demo","real","Deriv-App-ID","deriv-account-gateway","/deriv/account-context"]
          forbidden=["ws.derivws.com/websockets/v3","ws.binaryws.com/websockets/v3","authorize:"]
          missing=[x for x in required if x not in text]
          bad=[x for x in forbidden if x in text]
          Path("audit-artifacts/deriv-universal-report.md").write_text(f"# Universal Server Deriv Gateway\n\nMissing: {missing}\nLegacy: {bad}\n")
          print(Path("audit-artifacts/deriv-universal-report.md").read_text())
          if missing or bad:
              raise SystemExit(1)
          PY

      - name: TypeScript validation
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter @workspace/api-server run typecheck

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deriv-universal-account-audit-report
          path: audit-artifacts/
