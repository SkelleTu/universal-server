name: Deriv Account Architecture Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deriv-account-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Universal Server
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Inventory Deriv delegation surface
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-artifacts
          {
            echo "# Universal Server Deriv Account Architecture Audit"
            echo "Commit: `$(git rev-parse HEAD)`"
            echo
            echo "## Relevant source"
            git ls-files | grep -Ei 'deriv|trading|account|session|websocket|api-server' | sort || true
            echo
            echo "## Deriv/account markers"
            git grep -nEi 'deriv|accountId|accountType|loginid|authorize|otp|websockets/v3|api\.derivws|trading/v1|/demo|/real' -- ':!*.lock' || true
          } | tee audit-artifacts/deriv-universal-inventory.md

      - name: Validate Universal Server account/session contract
        shell: bash
        run: |
          set -euo pipefail
          files="$(git ls-files 'artifacts/**/*.ts' 'artifacts/**/*.tsx' 'artifacts/**/*.js' 'artifacts/**/*.mjs' 2>/dev/null | tr '
' ' ')"
          [ -n "$files" ] || { echo "No Universal Server source files found"; exit 1; }

          grep -Eiq 'session|account|trading' $files || {
            echo "::error::Universal Server has no detectable account/trading session layer."
            exit 1
          }

          if grep -Eiq 'api\.derivws|trading/v1|ws\.derivws\.com/websockets/v3' $files; then
            grep -Eiq 'account(Id|ID)|accountId|account_id' $files || {
              echo "::error::Deriv endpoint detected without account identity routing."
              exit 1
            }
            grep -Eiq 'demo|real' $files || {
              echo "::error::Deriv endpoint detected without Demo/Real routing markers."
              exit 1
            }
          else
            echo "::warning::Universal Server currently has no direct Deriv API implementation. Audit remains red until the centralized Deriv account gateway is introduced."
            exit 1
          fi

      - name: TypeScript validation
        run: |
          if [ -f package.json ]; then
            corepack enable
            pnpm install --frozen-lockfile
            pnpm -r --if-present typecheck
          fi

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deriv-universal-account-audit-report
          path: audit-artifacts/
