name: Repair pnpm lockfile

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: pnpm
      - name: Regenerate lockfile
        run: |
          pnpm install --lockfile-only --no-frozen-lockfile
          pnpm --filter @workspace/api-server add @modelcontextprotocol/sdk@1.30.1 --lockfile-only --ignore-scripts
          pnpm install --frozen-lockfile
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already consistent."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: regenerate pnpm lockfile"
          git push
