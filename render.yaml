services:
  - type: web
    name: universal-server
    runtime: node
    plan: free
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm run build:render
    startCommand: pnpm start
    healthCheckPath: /api/healthz
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.14.1
      - key: BACKUP_GITHUB_REPO
        value: SkelleTu/universal-server-backups
      - key: BACKUP_GITHUB_TOKEN
        sync: false
      - key: UNIVERSAL_SERVER_BACKUP_ENCRYPTION_KEY
        sync: false
      - key: BACKUP_INTERVAL_MS
        value: "900000"
